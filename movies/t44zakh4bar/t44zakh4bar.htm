.buttonep {
			background-color: #0684C4;
			border: none;
			color: white;
			padding: 2px 4px;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			font-size: 10px;
			margin: 2px 1px;
			cursor: pointer;
			border-radius: 5px;
		}
			
		
		.buttonep:hover {
			background-color: #8EBF6E; /* light green*/
		}
		.buttonep:clicked {
			background-color: green; /* Green */
		}
		
		.buttonep:focus {
			background-color: #006805; /* Green or blue */
		}
